name: safepay_app
description: "SafePay — Marketplace and escrow platform for Nigerian commodity trading."
publish_to: 'none'

version: 1.3.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  iconsax_flutter: ^1.0.1
  lottie: ^3.1.2
  glass_ui: ^1.0.5
  google_fonts: ^8.2.1
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/logo_3d.png
